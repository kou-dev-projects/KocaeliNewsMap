
services:
  mongodb:
    image: mongo:8.0
    container_name: kocaeli-news_map_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    environment:
      MONGO_INITDB_DATABASE: kocaeli_news

  redis:
    image: redis:7-alpine
    container_name: kocaeli-news_map_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    container_name: kocaeli-news_map_backend
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - mongodb
    environment:
      - MONGO_URL=${MONGO_URL}
      - MONGO_DB=kocaeli_news
      - REDIS_URL=redis://redis:6379
      - WORKER_ID=api
    env_file:
      - .env
    volumes:
      - ./backend:/app

  worker:
    build: ./backend
    container_name: kocaeli-news_map_worker
    depends_on:
      - redis
      - mongodb
    command: ["python", "-m", "app.workers.job_worker"]
    environment:
      - MONGO_URL=${MONGO_URL}
      - MONGO_DB=kocaeli_news
      - REDIS_URL=redis://redis:6379
      - WORKER_ID=worker
    env_file:
      - .env
    volumes:
      - ./backend:/app
    restart: unless-stopped

  scheduler:
    build: ./backend
    container_name: kocaeli-news_map_scheduler
    depends_on:
      - redis
    command: ["python", "-m", "app.workers.run_scheduler"]
    environment:
      - MONGO_URL=${MONGO_URL}
      - MONGO_DB=kocaeli_news
      - REDIS_URL=redis://redis:6379
      - WORKER_ID=scheduler
    env_file:
      - .env
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: kocaeli-news_map_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  mongo_data:
  redis_data:
